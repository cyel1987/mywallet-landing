<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0F2A2C">
<title>Tally — Personal Expense Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg: #0F2A2C;
    --bg-2: #123234;
    --panel: #163A3C;
    --panel-light: #1B4547;
    --cream: #F2ECDD;
    --gold: #E8B45C;
    --mint: #7FD9A8;
    --coral: #E8615C;
    --muted: #7FA3A0;
    --line: rgba(242,236,221,0.12);

    --cat-food: #E8B45C;
    --cat-groceries: #7FD9A8;
    --cat-transport: #6FA8DC;
    --cat-shopping: #E8615C;
    --cat-bills: #B98CE0;
    --cat-entertainment: #F2A65A;
    --cat-health: #5CC9C6;
    --cat-travel: #D98CD9;
    --cat-transfers: #9AA5B1;
    --cat-other: #8C93A0;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family:'Inter', sans-serif;
    background: var(--bg);
    color: var(--cream);
    display:flex;
    min-height:640px;
  }
  ::selection{ background: var(--gold); color: var(--bg); }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:212px; flex-shrink:0;
    background: var(--bg-2);
    border-right:1px solid var(--line);
    padding:24px 16px;
    display:flex; flex-direction:column;
  }
  .brand{ font-family:'Fraunces', serif; font-weight:700; font-size:24px; letter-spacing:-0.01em; margin-bottom:2px; }
  .brand span{ color: var(--gold); }
  .brand-sub{ font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color: var(--muted); margin-bottom:30px; }
  nav{ display:flex; flex-direction:column; gap:4px; flex:1; min-height:0; }
  .nav-btn{
    font-family:'Inter', sans-serif; font-weight:500; text-align:left; background:none; border:none;
    color:#A9C4C1; font-size:14.5px; padding:10px 12px; border-radius:6px; cursor:pointer;
    display:flex; align-items:center; gap:10px; transition: background 0.15s, color 0.15s;
  }
  .nav-btn:hover{ background: rgba(242,236,221,0.06); color: var(--cream); }
  .nav-btn.active{ background: var(--gold); color: var(--bg); font-weight:700; }
  .nav-dot{ width:6px; height:6px; border-radius:50%; background:currentColor; opacity:0.55; }
  .sidebar-foot{ margin-top:auto; font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--muted); line-height:1.6; border-top:1px solid var(--line); padding-top:14px; }

  /* ---------- Main ---------- */
  main{ flex:1; padding:32px 38px; overflow-y:auto; }
  .page-head{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:26px; }
  .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color: var(--gold); margin-bottom:6px; }
  h1{ font-family:'Fraunces', serif; font-weight:600; font-size:28px; margin:0; }
  h2{ font-family:'Fraunces', serif; font-weight:600; font-size:18px; margin:0 0 6px; }
  p.desc{ font-size:13.5px; color: var(--muted); margin:0 0 16px; line-height:1.5; max-width:560px; }

  .btn{
    font-family:'Inter', sans-serif; font-weight:600; background: var(--gold); color: var(--bg);
    border:none; padding:10px 18px; border-radius:7px; font-size:13.5px; cursor:pointer; transition:filter 0.15s, transform 0.1s;
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn:active{ transform: scale(0.97); }
  .btn.ghost{ background:none; border:1px solid var(--line); color: var(--cream); }
  .btn.ghost:hover{ border-color: var(--gold); }
  .btn.small{ padding:6px 12px; font-size:12px; border-radius:5px; }
  .btn[disabled]{ opacity:0.5; cursor:wait; }

  /* ---------- Stat cards ---------- */
  .stat-row{ display:flex; gap:16px; margin-bottom:28px; }
  .stat-card{ flex:1; background: var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
  .stat-label{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color: var(--muted); margin-bottom:8px; }
  .stat-value{ font-family:'Fraunces', serif; font-size:30px; font-weight:600; }
  .stat-value.coral{ color: var(--coral); }
  .stat-value.mint{ color: var(--mint); }

  .dash-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:24px; }

  /* ---------- Budget gauges ---------- */
  .gauge-row{ margin-bottom:14px; }
  .gauge-head{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; }
  .gauge-head .amt{ font-family:'IBM Plex Mono', monospace; color: var(--muted); }
  .gauge-track{ height:14px; border-radius:7px; background: rgba(242,236,221,0.08); overflow:hidden; }
  .gauge-fill{ height:100%; border-radius:7px; transition: width 0.6s ease; }

  /* ---------- Category chip ---------- */
  .chip{ display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:600; }
  .chip .dot{ width:7px; height:7px; border-radius:50%; }

  /* ---------- Transactions table ---------- */
  .txn-table{ width:100%; border-collapse:collapse; }
  .txn-table th{ text-align:left; font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color: var(--muted); padding:8px 10px; border-bottom:1px solid var(--line); }
  .txn-table td{ padding:10px 10px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
  .txn-table tr:hover td{ background: rgba(242,236,221,0.03); }
  .txn-amt{ font-family:'IBM Plex Mono', monospace; text-align:right; }
  select.cat-select{
    background: var(--panel-light); color: var(--cream); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-size:12.5px; font-family:'Inter',sans-serif;
  }

  /* ---------- Forms ---------- */
  .form-panel{ background: var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px 22px; margin-bottom:22px; max-width:640px; }
  .form-row{ display:flex; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
  .budget-inline-group{ display:flex; gap:10px; align-items:flex-end; margin-bottom:16px; }
  .form-field{ flex:1; min-width:120px; display:flex; flex-direction:column; gap:4px; }
  label{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color: var(--muted); }
  input, select{ font-family:'Inter', sans-serif; font-size:14px; padding:9px 10px; border-radius:6px; border:1px solid var(--line); background: var(--panel-light); color: var(--cream); }
  input:focus, select:focus, .nav-btn:focus-visible, .btn:focus-visible{ outline:2px solid var(--gold); outline-offset:1px; }
  ::placeholder{ color:#5E827F; }

  /* ---------- Import ---------- */
  .dropzone{
    border:2px dashed var(--line); border-radius:12px; padding:40px 20px; text-align:center; cursor:pointer;
    transition:border-color 0.15s, background 0.15s; max-width:640px;
  }
  .dropzone:hover, .dropzone.drag{ border-color: var(--gold); background: rgba(232,180,92,0.05); }
  .dropzone .big{ font-family:'Fraunces', serif; font-size:18px; margin-bottom:6px; }
  .dropzone .small{ font-size:12.5px; color: var(--muted); }
  .import-warn{ font-size:12.5px; color: var(--gold); background: rgba(232,180,92,0.08); border:1px solid rgba(232,180,92,0.3); border-radius:8px; padding:10px 14px; margin:14px 0; max-width:640px; }

  /* ---------- AI output ---------- */
  .ai-output{ margin-top:12px; padding:14px 16px; background: var(--panel-light); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; font-size:13px; line-height:1.6; white-space:pre-wrap; max-width:560px; }
  .empty-note{ font-size:13.5px; color: var(--muted); font-style:italic; padding:10px 0; }
  .auto-section{ max-width:640px; margin-bottom:30px; }
  .auto-item{ background: var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 16px; margin-bottom:10px; }
  .auto-item-row{ display:flex; justify-content:space-between; align-items:center; gap:14px; font-size:13.5px; }

  .toast{ position:fixed; bottom:24px; right:24px; background: var(--cream); color: var(--bg); padding:12px 18px; font-weight:600; font-size:13.5px; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,0.4); opacity:0; transform:translateY(10px); transition:opacity 0.25s, transform 0.25s; pointer-events:none; }
  .toast.show{ opacity:1; transform:translateY(0); }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--panel-light); border-radius:4px; }

  /* ---------- Mobile top bar (hidden on desktop) ---------- */
  .mobile-topbar{ display:none; }
  .hamburger-btn{
    background:none; border:1px solid var(--line); color:var(--cream);
    font-size:20px; line-height:1; padding:6px 12px; border-radius:7px; cursor:pointer;
  }
  .sidebar-overlay{ display:none; }

  /* ---------- Onboarding tutorial ---------- */
  .tutorial-overlay{
    position:fixed; inset:0; z-index:900; background:rgba(0,0,0,0.6);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .tutorial-card{
    background: var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:32px 30px; max-width:420px; width:100%; box-shadow:0 12px 40px rgba(0,0,0,0.4);
  }
  .tutorial-title{ font-family:'Fraunces',serif; font-weight:600; font-size:21px; margin-bottom:10px; }
  .tutorial-body{ font-size:14px; line-height:1.6; color:var(--cream); margin-bottom:22px; }
  .tutorial-dots{ display:flex; gap:6px; justify-content:center; margin-bottom:20px; }
  .tutorial-dot{ width:7px; height:7px; border-radius:50%; background: var(--line); transition:background 0.2s; }
  .tutorial-dot.active{ background: var(--gold); }
  .tutorial-actions{ display:flex; justify-content:space-between; align-items:center; }

  @media (max-width: 820px){
    body{ min-height:100vh; }
    #app-root{ flex-direction:column; min-height:auto; }

    .mobile-topbar{
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 18px; background: var(--bg-2); border-bottom:1px solid var(--line);
      position:sticky; top:0; z-index:200;
    }

    .sidebar{
      position:fixed; top:0; left:0; height:100vh; width:240px; z-index:400;
      transform:translateX(-100%); transition:transform 0.25s ease;
      box-shadow:4px 0 20px rgba(0,0,0,0.3);
    }
    .sidebar.open{ transform:translateX(0); }

    .sidebar-overlay{
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:300;
    }
    .sidebar-overlay.show{ display:block; }

    main{ padding:20px 16px; }

    .stat-row{ flex-wrap:wrap; }
    .stat-card{ min-width:140px; flex:1 1 45%; }

    .page-head{ flex-wrap:wrap; gap:10px; }
    h1{ font-size:23px; }

    .dash-grid{ grid-template-columns:1fr; }

    .form-row{ flex-direction:column; align-items:stretch !important; }
    .form-row .btn, .form-row .btn.small, .form-row .btn.ghost{ width:auto; align-self:flex-start; }

    /* Scroll tables horizontally instead of squeezing columns unreadably small.
       table-layout:fixed + a shared min-width is essential here — without it,
       the header and body (each its own table context below) would compute
       column widths independently from their own content and drift out of
       alignment with each other. */
    .txn-table{ display:block; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .txn-table thead, .txn-table tbody{ display:table; width:100%; min-width:600px; table-layout:fixed; }
    .txn-table td, .txn-table th{ overflow-wrap:break-word; word-break:break-word; }

    .dropzone{ padding:28px 14px; }
  }

  @media (max-width: 480px){
    .stat-card{ flex:1 1 100%; }
    main{ padding:16px 12px; }
  }
</style>
</head>
<body>

<!-- CONFIG is now loaded automatically from Vercel's environment variables via
     /api/config — see api/config.js. Nothing here needs manual editing anymore. -->
<script>
  let CONFIG = null;
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>

<div id="auth-screen" style="min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; background:#0F2A2C; font-family:'Inter',sans-serif;">
  <div style="background:#163A3C; border:1px solid rgba(242,236,221,0.12); border-radius:12px; padding:32px; width:320px; color:#F2ECDD;">
    <div style="font-family:'Fraunces',serif; font-weight:700; font-size:24px; margin-bottom:4px;">Tally<span style="color:#E8B45C;">.</span></div>
    <div style="font-size:12.5px; color:#7FA3A0; margin-bottom:20px;">Sign in to your own private tracker</div>
    <input id="auth-email" type="email" placeholder="Email" style="width:100%; padding:9px 10px; margin-bottom:8px; border-radius:6px; border:1px solid rgba(242,236,221,0.12); background:#1B4547; color:#F2ECDD;">
    <input id="auth-password" type="password" placeholder="Password" style="width:100%; padding:9px 10px; margin-bottom:12px; border-radius:6px; border:1px solid rgba(242,236,221,0.12); background:#1B4547; color:#F2ECDD;">
    <button id="auth-signin-btn" style="width:100%; padding:10px; margin-bottom:8px; border:none; border-radius:7px; background:#E8B45C; color:#0F2A2C; font-weight:600; cursor:pointer;">Sign in</button>
    <button id="auth-signup-btn" style="width:100%; padding:10px; border:1px solid rgba(242,236,221,0.12); border-radius:7px; background:none; color:#F2ECDD; cursor:pointer;">Create account</button>
    <div id="auth-msg" style="margin-top:12px; font-size:12.5px; color:#E8615C;"></div>
  </div>
</div>

<div id="app-root" style="display:none;">
<div class="mobile-topbar">
  <div class="brand" style="font-size:19px;">Tally<span>.</span></div>
  <button class="hamburger-btn" id="btn-hamburger" aria-label="Open menu">☰</button>
</div>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="sidebar" id="sidebar">
  <div class="brand">Tally<span>.</span></div>
  <div class="brand-sub">personal expense tracker</div>
  <nav id="nav"></nav>
  <div class="sidebar-foot" id="footdate"></div>
</div>

<main id="main"></main>
<div class="toast" id="toast"></div>
<div id="tutorial-overlay" style="display:none;"></div>
<input type="file" id="csv-file-input" accept=".csv,.pdf,.png,.jpg,.jpeg" style="display:none;">
<input type="file" id="receipt-file-input" accept="image/*" capture="environment" style="display:none;">
</div>

<script>
/* ================= CONSTANTS ================= */
const DEFAULT_CATEGORIES = ['Food & Drink','Groceries','Transport','Shopping','Bills & Utilities','Entertainment','Health','Travel','Rent','Mortgage','Car Loan','Insurance','Transfers','Other'];
const CATEGORIES = [...DEFAULT_CATEGORIES]; // mutated in place by refreshActiveCategories() — every existing reference to CATEGORIES elsewhere automatically stays in sync
const CAT_COLOR = {
  'Food & Drink':'#E8B45C', 'Groceries':'#7FD9A8', 'Transport':'#6FA8DC',
  'Shopping':'#E8615C', 'Bills & Utilities':'#B98CE0', 'Entertainment':'#F2A65A',
  'Health':'#5CC9C6', 'Travel':'#D98CD9', 'Rent':'#D9A66C', 'Mortgage':'#7C8CE8',
  'Car Loan':'#C97B84', 'Insurance':'#A9A65C', 'Transfers':'#9AA5B1', 'Other':'#8C93A0',
  'Uncategorized': '#5E827F'
};
function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/* ================= AUTH + SUPABASE ================= */
let supabaseClient = null;

async function loadConfig(){
  try{
    const res = await fetch('/api/config');
    if(!res.ok) throw new Error('Config endpoint returned ' + res.status);
    CONFIG = await res.json();
    supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    return true;
  }catch(e){
    console.error('Failed to load config:', e);
    document.getElementById('auth-screen').innerHTML =
      '<div style="color:#F2ECDD; font-family:sans-serif; text-align:center; padding:40px; max-width:400px;">' +
      '<h2>Couldn\'t load configuration</h2>' +
      '<p style="color:#E8615C; font-size:13px;">Make sure /api/config.js is deployed and your Vercel environment variables are set (SUPABASE_URL, SUPABASE_ANON_KEY, APP_SHARED_SECRET).</p>' +
      '</div>';
    return false;
  }
}

function setAuthMsg(msg){ document.getElementById('auth-msg').textContent = msg; }

async function handleSignIn(){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  setAuthMsg('Signing in…');
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error){ setAuthMsg(error.message); return; }
  startApp();
}
async function handleSignUp(){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  if(password.length < 6){ setAuthMsg('Password needs at least 6 characters'); return; }
  setAuthMsg('Creating account…');
  const { error } = await supabaseClient.auth.signUp({ email, password });
  if(error){ setAuthMsg(error.message); return; }
  setAuthMsg('Check your email to confirm your account, then sign in.');
}
async function startApp(){
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app-root').style.cssText = 'display:flex; min-height:100vh; width:100%;';
  selectedMonth = currentMonthKey();
  budgetsMonth = currentMonthKey();
  incomeMonth = currentMonthKey();
  document.getElementById('footdate').textContent = new Date().toLocaleDateString(undefined,{weekday:'long', month:'short', day:'numeric', year:'numeric'});

  try{
    const { data: { user } } = await supabaseClient.auth.getUser();
    const signupYear = (user && user.created_at) ? new Date(user.created_at).getFullYear() : new Date().getFullYear();
    earliestMonthKey = `${signupYear}-01`;
  }catch(e){
    earliestMonthKey = `${new Date().getFullYear()}-01`;
  }

  try{
    await loadState();
  }catch(e){
    return; // loadState already showed a clear error screen — stop here, don't touch anything else
  }
  refreshActiveCategories();
  await ensureRecurringGenerated();
  await ensureRecurringIncomeGenerated();
  renderAll();

  if(!state.hasSeenTutorial){
    startTutorial();
  }
}

/* ================= DATA LAYER ================= */
let state = { transactions: [], budgets: {}, budgetsByMonth: {}, salary: 0, salaryByMonth: {}, income: [], recurringExpenses: [], recurringIncome: [], customCategories: [], disabledCategories: [], categoryColors: {}, monthCategories: {} };

const INCOME_TYPES = ['Bonus','Freelance','Other'];
const INCOME_COLOR = { 'Bonus':'#7FD9A8', 'Freelance':'#6FA8DC', 'Other':'#8C93A0' };

function uid(p){ return p + '_' + Math.random().toString(36).slice(2,9); }
function fmt(n){ const s = n<0 ? '-' : ''; return s + '$' + Math.abs(n).toFixed(2); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function normalizeState(s){
  const safe = s && typeof s === 'object' ? s : {};
  return {
    transactions: Array.isArray(safe.transactions) ? safe.transactions : [],
    budgets: safe.budgets && typeof safe.budgets === 'object' ? safe.budgets : {},
    budgetsByMonth: safe.budgetsByMonth && typeof safe.budgetsByMonth === 'object' ? safe.budgetsByMonth : {},
    salary: typeof safe.salary === 'number' ? safe.salary : 0,
    salaryByMonth: safe.salaryByMonth && typeof safe.salaryByMonth === 'object' ? safe.salaryByMonth : {},
    income: Array.isArray(safe.income) ? safe.income : [],
    recurringExpenses: Array.isArray(safe.recurringExpenses) ? safe.recurringExpenses : [],
    recurringIncome: Array.isArray(safe.recurringIncome) ? safe.recurringIncome : [],
    customCategories: Array.isArray(safe.customCategories) ? safe.customCategories : [],
    disabledCategories: Array.isArray(safe.disabledCategories) ? safe.disabledCategories : [],
    categoryColors: safe.categoryColors && typeof safe.categoryColors === 'object' ? safe.categoryColors : {},
    monthCategories: safe.monthCategories && typeof safe.monthCategories === 'object' ? safe.monthCategories : {},
    hasSeenTutorial: !!safe.hasSeenTutorial,
  };
}

function refreshActiveCategories(){
  const all = [...DEFAULT_CATEGORIES, ...(state.customCategories || [])];
  const active = all.filter(c => !(state.disabledCategories || []).includes(c));
  CATEGORIES.length = 0;
  CATEGORIES.push(...active);
}

async function loadState(){
  try{
    const { data: { user }, error: userErr } = await supabaseClient.auth.getUser();
    if(userErr || !user) throw (userErr || new Error('Could not confirm your account'));
    const { data, error } = await supabaseClient.from('app_state').select('data').eq('user_id', user.id).maybeSingle();
    if(error) throw error;
    if(data && data.data){
      const before = data.data;
      state = normalizeState(before);
      // If anything was missing/malformed, persist the repaired shape so this fixes itself for good
      if(JSON.stringify(before) !== JSON.stringify(state)) await saveState();
    } else {
      // No row exists at all for this user — genuinely a brand-new account.
      // Start completely empty, not with demo/sample data.
      state = normalizeState({});
      await saveState();
    }
  }catch(e){
    console.error('load failed', e);
    // CRITICAL: never silently fall back to seed data here. Doing so would let
    // the very next save overwrite the user's real saved data with a reset
    // state. Instead, stop cold and show a clear error so nothing gets saved
    // until the real data has actually loaded successfully.
    document.getElementById('app-root').innerHTML =
      '<div style="padding:60px 24px; color:#F2ECDD; font-family:sans-serif; max-width:480px; margin:0 auto;">' +
      '<h2 style="font-family:serif;">Couldn\'t load your data</h2>' +
      '<p style="color:#E8615C; font-size:14px; line-height:1.5;">Something went wrong loading your account, so nothing has been changed or saved — your existing data is safe. Please check your connection and retry.</p>' +
      '<button onclick="location.reload()" style="margin-top:16px; padding:10px 20px; background:#E8B45C; border:none; border-radius:7px; cursor:pointer; font-weight:600; font-size:14px;">Retry</button>' +
      '</div>';
    document.getElementById('app-root').style.cssText = 'display:flex; min-height:100vh; width:100%;';
    throw e; // stop startApp() from proceeding any further
  }
}
async function saveState(){
  try{
    const { data: { user } } = await supabaseClient.auth.getUser();
    const { error } = await supabaseClient.from('app_state').upsert({
      user_id: user.id, data: state, updated_at: new Date().toISOString()
    });
    if(error) throw error;
  }catch(e){ console.error('save failed', e); toast('Could not save — check your connection'); }
}

async function ensureRecurringGenerated(){
  if(!state.recurringExpenses || !state.recurringExpenses.length) return;
  const maxMonth = shiftMonth(currentMonthKey(), 1); // never generate further than one month ahead
  let added = 0;
  state.recurringExpenses.forEach(rule=>{
    let mk = rule.startMonth || currentMonthKey(); // rules without a start month behave as before: current + next only
    if(earliestMonthKey && mk < earliestMonthKey) mk = earliestMonthKey; // can never predate the account's signup month
    while(mk <= maxMonth){
      const isStopped = rule.status === 'inactive' && rule.deactivateFromMonth && mk >= rule.deactivateFromMonth;
      if(!isStopped){
        const alreadyExists = state.transactions.some(t => t.recurringId === rule.id && monthKey(t.date) === mk);
        if(!alreadyExists){
          state.transactions.push({
            id: uid('t'),
            date: dateForDayInMonth(mk, rule.day),
            description: rule.description,
            store: rule.store || '',
            amount: rule.amount,
            category: rule.category,
            source: 'recurring',
            recurringId: rule.id,
          });
          added++;
        }
      }
      mk = shiftMonth(mk, 1);
    }
  });
  if(added > 0) await saveState();
}

async function ensureRecurringIncomeGenerated(){
  if(!state.recurringIncome || !state.recurringIncome.length) return;
  const maxMonth = shiftMonth(currentMonthKey(), 1);
  let added = 0;
  state.recurringIncome.forEach(rule=>{
    let mk = rule.startMonth || currentMonthKey();
    if(earliestMonthKey && mk < earliestMonthKey) mk = earliestMonthKey;
    while(mk <= maxMonth){
      const isStopped = rule.status === 'inactive' && rule.deactivateFromMonth && mk >= rule.deactivateFromMonth;
      if(!isStopped){
        const alreadyExists = state.income.some(i => i.recurringIncomeId === rule.id && monthKey(i.date) === mk);
        if(!alreadyExists){
          state.income.push({
            id: uid('i'),
            date: dateForDayInMonth(mk, rule.day),
            type: rule.type,
            note: rule.description,
            store: rule.store || '',
            amount: rule.amount,
            source: 'recurring',
            recurringIncomeId: rule.id,
          });
          added++;
        }
      }
      mk = shiftMonth(mk, 1);
    }
  });
  if(added > 0) await saveState();
}

/* ================= HELPERS ================= */
function monthKey(dateStr){ return dateStr.slice(0,7); }
function currentMonthKey(){ return new Date().toISOString().slice(0,7); }
function shiftMonth(key, delta){
  const [y,m] = key.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  const d = new Date(y, m-1, 1);
  return d.toLocaleDateString(undefined, {month:'long', year:'numeric'});
}
function dateForDayInMonth(mk, day){
  const [y,m] = mk.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const safeDay = Math.min(Math.max(parseInt(day)||1, 1), daysInMonth);
  return `${mk}-${String(safeDay).padStart(2,'0')}`;
}
function dayOptionsForMonth(mk, selected){
  const [y,m] = mk.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const options = [];
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${mk}-${String(d).padStart(2,'0')}`;
    options.push(`<option value="${dateStr}" ${dateStr===selected?'selected':''}>${d}</option>`);
  }
  return options.join('');
}
function ordinalDay(day){
  const n = parseInt(day) || 1;
  const suffix = (n % 10 === 1 && n !== 11) ? 'st' : (n % 10 === 2 && n !== 12) ? 'nd' : (n % 10 === 3 && n !== 13) ? 'rd' : 'th';
  return n + suffix;
}
function currentCalendarYear(){ return new Date().getFullYear(); }
function budgetYearOptions(selected){
  const signupYear = earliestMonthKey ? parseInt(earliestMonthKey.slice(0,4)) : currentCalendarYear();
  const years = [];
  for(let y=signupYear; y<=currentCalendarYear(); y++) years.push(y);
  return years.map(y=>`<option value="${y}" ${String(y)===String(selected)?'selected':''}>${y}</option>`).join('');
}
function budgetMonthOptions(selectedMonthNum){
  const names = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return names.map((name,i)=>{
    const num = String(i+1).padStart(2,'0');
    return `<option value="${num}" ${num===selectedMonthNum?'selected':''}>${name}</option>`;
  }).join('');
}
function futureMonthOptions(selected){
  const cmk = currentMonthKey();
  const months = [];
  for(let i=0; i<=12; i++) months.push(shiftMonth(cmk, i));
  return months.map(mk=>`<option value="${mk}" ${mk===selected?'selected':''}>${monthLabel(mk)}</option>`).join('');
}
function pastMonthOptions(selected){
  const cmk = currentMonthKey();
  const start = earliestMonthKey || shiftMonth(cmk, -18);
  const months = [];
  let mk = start;
  while(mk <= cmk){
    months.push(mk);
    mk = shiftMonth(mk, 1);
  }
  return months.map(mk=>`<option value="${mk}" ${mk===selected?'selected':''}>${monthLabel(mk)}</option>`).join('');
}
function formatDate(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
}
function getBudgetsForMonth(mk){
  return state.budgetsByMonth[mk] || state.budgets || {};
}
function getSalaryForMonth(mk){
  return state.salaryByMonth[mk] !== undefined ? state.salaryByMonth[mk] : (state.salary || 0);
}
function getMonthCategories(mk){
  return state.monthCategories[mk] || CATEGORIES.filter(c=>c!=='Transfers');
}

function getCategoryColor(cat){
  if(state.categoryColors && state.categoryColors[cat]) return state.categoryColors[cat];
  return CAT_COLOR[cat] || CAT_COLOR['Other'];
}
function categoryChip(cat){
  const color = getCategoryColor(cat);
  return `<span class="chip" style="background:${hexToRgba(color,0.18)}; color:${color};"><span class="dot" style="background:${color};"></span>${escapeHtml(cat)}</span>`;
}
function incomeChip(type){
  const color = INCOME_COLOR[type] || INCOME_COLOR['Other'];
  return `<span class="chip" style="background:${hexToRgba(color,0.18)}; color:${color};"><span class="dot" style="background:${color};"></span>${escapeHtml(type)}</span>`;
}

function categoryOptions(selected){
  return CATEGORIES.map(c=>`<option value="${c}" ${c===selected?'selected':''}>${c}</option>`).join('');
}

function detectRecurring(){
  // group by normalized description, look for 2+ months with similar amount
  const groups = {};
  state.transactions.forEach(t=>{
    const key = t.description.trim().toLowerCase();
    if(!groups[key]) groups[key] = [];
    groups[key].push(t);
  });
  const recurring = [];
  Object.entries(groups).forEach(([key, txns])=>{
    const months = new Set(txns.map(t=>monthKey(t.date)));
    if(months.size >= 2){
      const avg = txns.reduce((a,t)=>a+t.amount,0)/txns.length;
      recurring.push({ description: txns[0].description, count: txns.length, avg, category: txns[0].category });
    }
  });
  return recurring.sort((a,b)=>b.avg-a.avg);
}

function fileToDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function callClaudeVision(base64Data, mediaType, prompt){
  const response = await fetch("/api/claude-proxy", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-App-Secret": CONFIG.APP_SHARED_SECRET
    },
    body: JSON.stringify({
      model: "claude-haiku-4-5-20251001",
      max_tokens: 1000,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: mediaType, data: base64Data } },
          { type: "text", text: prompt }
        ]
      }]
    })
  });
  const data = await response.json();
  if(!response.ok) throw new Error(data.error || 'Proxy request failed');
  return (data.content || []).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}

function resizeImageFile(file, maxDimension){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = ()=>{
      let { width, height } = img;
      if(width > maxDimension || height > maxDimension){
        if(width > height){ height = Math.round(height * (maxDimension / width)); width = maxDimension; }
        else { width = Math.round(width * (maxDimension / height)); height = maxDimension; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(objectUrl);
      resolve(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(objectUrl); reject(new Error('Could not read that image file')); };
    img.src = objectUrl;
  });
}

async function handleReceiptFile(file){
  let dataUrl;
  try{
    // Phone camera photos are often 3-10MB — shrink to a sane size before
    // sending, well under hosting payload limits and much faster to process.
    dataUrl = await resizeImageFile(file, 1600);
  }catch(e){
    dataUrl = await fileToDataURL(file); // fallback if resizing itself fails
  }
  receiptScan = { imageDataUrl: dataUrl, status: 'scanning', data: null };
  currentPage = 'transactions';
  renderAll();
  try{
    const match = dataUrl.match(/^data:(.*);base64,(.*)$/s);
    const mediaType = match[1];
    const base64 = match[2];
    const prompt = `Look at this receipt photo. Extract the merchant name, the total amount paid (plain number, no currency symbol), the date if visible (format YYYY-MM-DD, else empty string), and classify it into exactly one category from this list: ${CATEGORIES.join(', ')}.\nRespond with ONLY a JSON object like {"merchant":"...","amount":0.00,"date":"YYYY-MM-DD","category":"..."} — no other text, no markdown fences. If the total isn't legible, set amount to 0.`;
    const text = await callClaudeVision(base64, mediaType, prompt);
    const cleaned = text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(cleaned);
    receiptScan.status = 'ready';
    receiptScan.data = {
      merchant: parsed.merchant || '',
      amount: parseFloat(parsed.amount) || 0,
      date: (parsed.date && /^\d{4}-\d{2}-\d{2}$/.test(parsed.date)) ? parsed.date : new Date().toISOString().slice(0,10),
      category: CATEGORIES.includes(parsed.category) ? parsed.category : 'Other',
    };
  }catch(e){
    console.error('Receipt scan failed:', e);
    receiptScan.status = 'error';
    receiptScan.errorDetail = (e && e.message) ? e.message : String(e);
  }
  renderAll();
}

function parseCSVLine(line){
  const out = [];
  let cur = '', inQuotes = false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(c === '"'){ inQuotes = !inQuotes; }
    else if(c === ',' && !inQuotes){ out.push(cur.trim()); cur=''; }
    else cur += c;
  }
  out.push(cur.trim());
  return out.map(s=>s.replace(/^"|"$/g,''));
}

function guessMerchantOrPerson(description){
  const desc = (description || '').trim();
  if(!desc) return '';

  // Common transfer wording: PayNow, FAST, GIRO, Transfer — usually followed by a person's name
  const transferMatch = desc.match(/^(?:paynow|fast payment|giro|transfer|p2p)\b[\s:\-]*\s*(?:to|from)?\s*[:\-]?\s*(.+)$/i);
  if(transferMatch){
    let name = transferMatch[1].trim();
    name = name.replace(/\s*\([^)]*\)\s*$/, '').trim(); // strip trailing "(dinner split)" style notes
    if(name && name.split(' ').length <= 4) return name;
  }

  // Otherwise, if there's a dash, the part before it is often the merchant name
  // e.g. "Grab - ride to office" -> "Grab", "SP Group - electricity" -> "SP Group"
  const dashIdx = desc.indexOf(' - ');
  if(dashIdx > 0) return desc.slice(0, dashIdx).trim();

  // Otherwise, strip a few common trailing generic words and use what's left
  return desc.replace(/\s+(subscription|payment|charge|fee|bill)$/i, '').trim();
}

function parseCSVFile(text){
  const lines = text.trim().split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return { rows: [], warning: 'The file looked empty.' };
  const header = parseCSVLine(lines[0]).map(h=>h.toLowerCase());
  let dateIdx = header.findIndex(h=>h.includes('date'));
  let descIdx = header.findIndex(h=>h.includes('desc')||h.includes('narrative')||h.includes('detail')||h.includes('particular')||h.includes('merchant')||h.includes('remark'));
  let amountIdx = header.findIndex(h=>h.includes('amount')||h.includes('debit')||h.includes('value'));
  let warning = null;
  if(dateIdx===-1 || descIdx===-1 || amountIdx===-1){
    dateIdx = 0; descIdx = 1; amountIdx = 2;
    warning = "Couldn't confidently detect column headers — assuming column order Date, Description, Amount. Check the preview below looks right.";
  }
  const rows = [];
  for(let i=1;i<lines.length;i++){
    const cols = parseCSVLine(lines[i]);
    if(cols.length < 2) continue;
    const rawAmount = (cols[amountIdx]||'').replace(/[^0-9.\-]/g,'');
    const amount = Math.abs(parseFloat(rawAmount)||0);
    const rawDate = cols[dateIdx] || '';
    const description = cols[descIdx] || '(no description)';
    rows.push({
      date: normalizeDate(rawDate),
      description,
      store: guessMerchantOrPerson(description),
      amount,
      category: 'Uncategorized',
    });
  }
  return { rows, warning };
}

function normalizeDate(raw){
  const d = new Date(raw);
  if(!isNaN(d.getTime())) return d.toISOString().slice(0,10);
  return raw;
}

/* ================= AI ================= */
async function callClaude(prompt){
  const response = await fetch("/api/claude-proxy", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-App-Secret": CONFIG.APP_SHARED_SECRET
    },
    body: JSON.stringify({
      model: "claude-haiku-4-5-20251001",
      max_tokens: 4000,
      messages: [{ role: "user", content: prompt }]
    })
  });
  const data = await response.json();
  if(!response.ok) return '';
  const text = (data.content || []).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  return text || '';
}

async function suggestCategory(description){
  const prompt = `Classify this personal expense into exactly one of these categories: ${CATEGORIES.join(', ')}.\nExpense description: "${description}"\nReply with ONLY the category name, nothing else.`;
  const text = await callClaude(prompt);
  const match = CATEGORIES.find(c => text.toLowerCase().includes(c.toLowerCase()));
  return match || 'Other';
}

async function suggestCategoriesBatch(rows){
  const list = rows.map((r,i)=> `${i}: "${r.description}" (${fmt(r.amount)})`).join('\n');
  const prompt = `Classify each personal expense below into exactly one category from this fixed list: ${CATEGORIES.join(', ')}.\nRespond with ONLY a JSON object mapping the row index (as a string) to the category name — no other text, no markdown fences.\nExample format: {"0":"Food & Drink","1":"Transport"}\n\nExpenses:\n${list}`;
  const text = await callClaude(prompt);
  try{
    const cleaned = text.replace(/```json|```/g,'').trim();
    return JSON.parse(cleaned);
  }catch(e){ return {}; }
}

function attachHandlers(){
  const hamburgerBtn = document.getElementById('btn-hamburger');
  if(hamburgerBtn){
    hamburgerBtn.onclick = ()=>{
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('sidebar-overlay').classList.add('show');

  }
  const statNeedsCategorizing = document.getElementById('stat-needs-categorizing');
  if(statNeedsCategorizing){
    statNeedsCategorizing.onclick = ()=>{
      currentPage = 'transactions';
      txnCategoryFilter = 'Uncategorized';
      txnMonthFilter = '';
      storeFilter = '';
      renderAll();
    };
  }
  const toggleOtherIncome = document.getElementById('toggle-other-income');
  if(toggleOtherIncome){
    toggleOtherIncome.onclick = ()=>{
      showAllOtherIncome = !showAllOtherIncome;
      renderAll();
    };
  }

  // Transactions: add form
  const addBtn = document.getElementById('btn-add-txn');
  if(addBtn){
    addBtn.onclick = ()=>{
      document.getElementById('add-txn-form').innerHTML = addTxnFormHtml();
      document.getElementById('btn-suggest-cat').onclick = async ()=>{
        const desc = document.getElementById('f-desc').value.trim();
        if(!desc){ toast('Type a description first'); return; }
        const b = document.getElementById('btn-suggest-cat');
        b.disabled = true; b.textContent = 'Thinking…';
        const cat = await suggestCategory(desc);
        document.getElementById('f-category').value = cat;
        b.disabled = false; b.textContent = 'Suggest category';
      };
      document.getElementById('btn-save-txn').onclick = async ()=>{
        const date = document.getElementById('f-date').value;
        const store = document.getElementById('f-store').value.trim();
        const description = document.getElementById('f-desc').value.trim();
        const amount = parseFloat(document.getElementById('f-amount').value) || 0;
        const category = document.getElementById('f-category').value;
        if(!description){ toast('Give it a description'); return; }
        state.transactions.push({id:uid('t'), date, description, store, amount, category, source:'manual'});
        await saveState();
        toast('Expense added');
        renderAll();
      };
      document.getElementById('btn-cancel-txn').onclick = ()=>{ document.getElementById('add-txn-form').innerHTML=''; };
    };
  }
  document.querySelectorAll('[data-recat]').forEach(sel=>{
    sel.onchange = async ()=>{
      const t = state.transactions.find(x=>x.id===sel.dataset.recat);
      t.category = sel.value;
      await saveState();
      toast('Category updated');
    };
  });
  document.querySelectorAll('[data-deltxn]').forEach(b=>{
    b.onclick = async ()=>{
      state.transactions = state.transactions.filter(t=>t.id!==b.dataset.deltxn);
      await saveState();
      toast('Removed');
      renderAll();
    };
  });
  const storeFilterSel = document.getElementById('f-store-filter');
  if(storeFilterSel){
    storeFilterSel.onchange = (e)=>{ storeFilter = e.target.value; renderAll(); };
  }
  const monthFilterSel = document.getElementById('f-month-filter');
  if(monthFilterSel){
    monthFilterSel.onchange = (e)=>{ txnMonthFilter = e.target.value; renderAll(); };
  }
  const categoryFilterSel = document.getElementById('f-category-filter');
  if(categoryFilterSel){
    categoryFilterSel.onchange = (e)=>{ txnCategoryFilter = e.target.value; renderAll(); };
  }
  const prevMonthBtn = document.getElementById('btn-prev-month');
  if(prevMonthBtn) prevMonthBtn.onclick = ()=>{
    const target = shiftMonth(selectedMonth, -1);
    selectedMonth = (earliestMonthKey && target < earliestMonthKey) ? earliestMonthKey : target;
    dashboardDayFilter = '';
    renderAll();
  };
  const nextMonthBtn = document.getElementById('btn-next-month');
  if(nextMonthBtn) nextMonthBtn.onclick = ()=>{
    const target = shiftMonth(selectedMonth, 1);
    const maxMonthKey = shiftMonth(currentMonthKey(), 1);
    selectedMonth = (target > maxMonthKey) ? maxMonthKey : target;
    dashboardDayFilter = '';
    renderAll();
  };
  const todayMonthBtn = document.getElementById('btn-today-month');
  if(todayMonthBtn) todayMonthBtn.onclick = ()=>{ selectedMonth = currentMonthKey(); dashboardDayFilter = ''; renderAll(); };

  });

    b.onclick = async ()=>{
      const id = b.dataset.savetxn;
      const t = state.transactions.find(x=>x.id===id);
      const newDate = document.getElementById('edit-date-'+id).value;
      const newStore = document.getElementById('edit-store-'+id).value.trim();
      const newDesc = document.getElementById('edit-desc-'+id).value.trim();
      const newAmount = parseFloat(document.getElementById('edit-amount-'+id).value);
      if(newDate) t.date = newDate;
      t.store = newStore;
      if(newDesc) t.description = newDesc;
      if(!isNaN(newAmount)) t.amount = newAmount;
      await saveState();
      editingTxnId = null;
      toast('Transaction updated');
      renderAll();
    };
  });

  // Receipt scanning
  const scanBtn = document.getElementById('btn-scan-receipt');
  const receiptInput = document.getElementById('receipt-file-input');
  if(scanBtn && receiptInput){
    scanBtn.onclick = ()=> receiptInput.click();
  }
  if(receiptInput){
    receiptInput.onchange = async (e)=>{
      const file = e.target.files[0];
      if(file) await handleReceiptFile(file);
      receiptInput.value = '';
    };
  }
  const dismissReceiptBtn = document.getElementById('btn-dismiss-receipt');
  if(dismissReceiptBtn){
    dismissReceiptBtn.onclick = ()=>{ receiptScan = null; renderAll(); };
  }
  const saveReceiptBtn = document.getElementById('btn-save-receipt');
  if(saveReceiptBtn){
    saveReceiptBtn.onclick = async ()=>{
      const date = document.getElementById('r-date').value;
      const store = document.getElementById('r-store').value.trim();
      const description = document.getElementById('r-desc').value.trim() || 'Receipt scan';
      const amount = parseFloat(document.getElementById('r-amount').value) || 0;
      const category = document.getElementById('r-category').value;
      state.transactions.push({id:uid('t'), date, description, store, amount, category, source:'receipt'});

      receiptScan = null;
      toast('Expense added from receipt');
      renderAll();
    };
  }
  const savePhotoBtn = document.getElementById('btn-save-receipt-photo');
  if(savePhotoBtn){
    savePhotoBtn.onclick = async ()=>{
      try{
        const res = await fetch(receiptScan.imageDataUrl);
        const blob = await res.blob();
        const file = new File([blob], `receipt-${Date.now()}.jpg`, { type: blob.type || 'image/jpeg' });
        if(navigator.canShare && navigator.canShare({ files: [file] })){
          await navigator.share({ files: [file], title: 'Receipt' });
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = file.name;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          toast('Photo downloaded — check Photos/Downloads');
        }
      }catch(e){
        if(e && e.name === 'AbortError') return; // user cancelled the share sheet — not an error
        console.error('Save photo failed', e);
        toast('Could not save photo');
      }
    };
  }

  // Import
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('csv-file-input');
  if(dropzone){
    dropzone.onclick = ()=> fileInput.click();
    dropzone.ondragover = (e)=>{ e.preventDefault(); dropzone.classList.add('drag'); };
    dropzone.ondragleave = ()=> dropzone.classList.remove('drag');
    dropzone.ondrop = async (e)=>{
      e.preventDefault(); dropzone.classList.remove('drag');
      const file = e.dataTransfer.files[0];
      if(file) await handleImportFile(file);
    };
  }
  if(fileInput){

async function handleImportFile(file){
  const ext = file.name.split('.').pop().toLowerCase();
  const isImage = file.type.startsWith('image/') || ['png','jpg','jpeg'].includes(ext);
  if(ext === 'pdf'){
    importPreview = { status: 'reading', kind: 'pdf' };
    renderAll();
    try{
      const text = await extractTextFromPDF(file);
      if(!text.trim()){
        importPreview = { status: 'error', kind: 'pdf', message: 'No readable text found — this PDF may be a scanned image rather than real text.' };
      } else {
        const rows = await extractTransactionsFromText(text);
        importPreview = {
          rows,
          warning: rows.length ? null : "Couldn't confidently find transactions in this PDF. It may use an unusual layout — try a CSV export instead if your bank offers one."
        };
      }
    }catch(e){
      console.error('PDF import failed', e);
      importPreview = { status: 'error', kind: 'pdf', message: (e && e.message) ? e.message : String(e) };
    }
  } else if(isImage){
    importPreview = { status: 'reading', kind: 'image' };
    renderAll();
    try{
      const rows = await extractTransactionsFromImage(file);
      importPreview = {
        rows,
        warning: rows.length ? null : "Couldn't confidently find transactions in this screenshot. Try a clearer, well-lit image, or a CSV/PDF export if your bank offers one."
      };
    }catch(e){
      console.error('Image import failed', e);
      importPreview = { status: 'error', kind: 'image', message: (e && e.message) ? e.message : String(e) };
    }
  } else {
    const text = await file.text();
    importPreview = parseCSVFile(text);
  }
  renderAll();
}

async function extractTransactionsFromImage(file){
  let dataUrl;
  try{
    dataUrl = await resizeImageFile(file, 1800);
  }catch(e){
    dataUrl = await fileToDataURL(file);
  }
  const match = dataUrl.match(/^data:(.*);base64,(.*)$/s);
  const mediaType = match[1];
  const base64 = match[2];
  const prompt = `This image is a screenshot of a bank or credit card statement, or a transaction list from a banking app. Find every individual transaction visible and return them as a JSON array. Each item must have:
- "date": the transaction date in YYYY-MM-DD format (infer the year if not shown)
- "description": the transaction description or merchant name as shown
- "merchantOrPerson": a short name for who was paid — the business/merchant name for a purchase, or the individual's name if this looks like a payment to a person (e.g. PayNow, a bank transfer). Leave empty string if unclear.
- "amount": the transaction amount as a plain positive number, no currency symbols

Important — this may show separate Withdrawal/Debit and Deposit/Credit columns or sections rather than one signed amount:
- Treat Withdrawal or Debit entries as expenses — include these.
- Skip Deposit or Credit entries entirely — these are incoming money, not expenses.
- If each line just has a single amount with no separate columns, include every transaction as normal.

Only include actual transactions — skip headers, balances, or totals. Respond with ONLY the JSON array, no other text, no markdown fences. If you can't find any transactions, respond with [].`;
  const text = await callClaudeVision(base64, mediaType, prompt);
  try{
    const cleaned = text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(cleaned);
    if(!Array.isArray(parsed)) return [];
    return parsed.map(p => ({
      date: normalizeDate(p.date || ''),
      description: p.description || '(no description)',
      store: p.merchantOrPerson || guessMerchantOrPerson(p.description || ''),
      amount: Math.abs(parseFloat(p.amount) || 0),
      category: 'Uncategorized',
    }));
  }catch(e){
    console.error('Could not parse AI response as JSON:', text);
    return [];
  }
}

async function extractTextFromPDF(file){
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let fullText = '';
  const maxPages = Math.min(pdf.numPages, 15); // cap for very long statements
  for(let i=1; i<=maxPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    fullText += content.items.map(item=>item.str).join(' ') + '\n';
  }
  return fullText;
}

async function extractTransactionsFromText(text){
  const trimmed = text.length > 12000 ? text.slice(0, 12000) : text;
  const prompt = `Below is raw text extracted from a bank or credit card statement PDF (spacing and layout may be imperfect since it was auto-extracted). Find every individual transaction and return them as a JSON array. Each item must have:
- "date": the transaction date in YYYY-MM-DD format (infer the year from the statement period if needed)
- "description": the transaction description exactly as shown
- "merchantOrPerson": a short name for who was paid — the business/merchant name if this looks like a purchase (e.g. "NTUC FairPrice", "Grab"), or the individual's name if this looks like a payment to a person (e.g. a PayNow, FAST, GIRO, or bank transfer to a named individual — just their name, nothing else). Leave empty string if you can't tell.
- "amount": the transaction amount as a plain positive number, no currency symbols

Important — this may be a bank statement or a credit card statement, and either can list amounts under separate columns rather than one signed amount column:
- Bank statements: treat "Withdrawal" entries as expenses. Skip "Deposit" entries entirely — incoming money is not an expense.
- Credit card statements: treat "Debit" entries as expenses (money spent/charged). Skip "Credit" entries entirely — these are payments made toward the card or refunds, not spending.
- If the statement instead uses a single signed amount column (no separate withdrawal/deposit or debit/credit split), include every transaction as normal.

Only include actual transactions — skip headers, column titles, running balances, and summary totals. Respond with ONLY the JSON array, no other text, no markdown fences. If you find nothing, respond with [].

Statement text:
${trimmed}`;
  const text2 = await callClaude(prompt);
  try{
    const cleaned = text2.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(cleaned);
    if(!Array.isArray(parsed)) return [];
    return parsed.map(p => ({
      date: normalizeDate(p.date || ''),
      description: p.description || '(no description)',
      store: p.merchantOrPerson || guessMerchantOrPerson(p.description || ''),
      amount: Math.abs(parseFloat(p.amount) || 0),
      category: 'Uncategorized',
    }));
  }catch(e){
    console.error('Could not parse AI response as JSON:', text2);
    return [];
  }
}
